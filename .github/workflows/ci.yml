name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install Python launcher used by the native executable
        run: sudo apt-get update && sudo apt-get install -y python-is-python3
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:native
      - run: npm run build
      - run: npm run test:browser
      - run: python scripts/package-omarchy.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quiet-youtube-packages
          if-no-files-found: error
          path: |
            dist/quiet-youtube-omarchy.tar.gz
            dist/quiet-youtube-omarchy.tar.gz.sha256
            dist/quiet-youtube.zip
